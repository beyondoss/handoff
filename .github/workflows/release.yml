name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  CARGO_TERM_COLOR: always
  # The published crate name (lib stays `handoff` for `use` statements).
  CRATE: beyond-handoff
  # Binary shipped as a release artifact for operators who want the
  # reference supervisor without embedding the library.
  BIN: handoff-supervisor
jobs:
  check-version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: check
        run: |
          LOCAL=$(cargo metadata --no-deps --format-version 1 \
            | jq -r --arg name "$CRATE" '.packages[] | select(.name == $name) | .version')
          echo "version=$LOCAL" >> "$GITHUB_OUTPUT"
          PUBLISHED=$(cargo search "$CRATE" --limit 1 2>/dev/null \
            | head -1 | sed -n 's/.*= "\(.*\)".*/\1/p')
          echo "local=$LOCAL published=$PUBLISHED"
          if [ "$LOCAL" = "$PUBLISHED" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    if: needs.check-version.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            archive: tar.gz
            cross: true
          - target: aarch64-apple-darwin
            runner: macos-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked
      - name: Build
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p handoff-supervisor
          else
            cargo build --release --target ${{ matrix.target }} -p handoff-supervisor
          fi
      - name: Package
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ env.BIN }}-${{ matrix.target }}.${{ matrix.archive }} ${{ env.BIN }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN }}-${{ matrix.target }}
          path: ${{ env.BIN }}-${{ matrix.target }}.${{ matrix.archive }}
  release:
    name: Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.check-version.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --title "v${{ needs.check-version.outputs.version }}" \
            --generate-notes \
            ${{ env.BIN }}-*.tar.gz
  publish:
    name: Publish to crates.io
    needs: [check-version, build]
    if: needs.check-version.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo publish -p ${{ env.CRATE }} --no-verify --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
