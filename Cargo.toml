[workspace]
resolver = "2"
members = ["crates/handoff", "crates/handoff-supervisor", "crates/handoff-tests"]

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.92"

[workspace.dependencies]
# Published as `beyond-handoff`; internal members continue to refer to it as
# `handoff` via the `package` rename so their `use handoff::*` statements
# don't churn when the crate is renamed for crates.io.
handoff = { path = "crates/handoff", version = "0.2.0", package = "beyond-handoff" }

libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["fs", "socket", "uio", "process", "signal"] }
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
