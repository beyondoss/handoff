[package]
name = "handoff-tests"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Fault-injection test harness and fixture binaries for the handoff crate"
publish = false

[lib]
name = "handoff_tests"
path = "src/lib.rs"

[[bin]]
name = "handoff-test-primitive"
path = "src/bin/primitive.rs"

[[bin]]
name = "handoff-test-supervisor"
path = "src/bin/supervisor.rs"

[dependencies]
handoff = { workspace = true, features = ["crash-points"] }
libc.workspace = true
nix.workspace = true
serde.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tempfile = "3"
anyhow = "1"
postcard = { workspace = true }
